<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>AFF HUB Bridge</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      width: 320px;
      background: #0f172a;
      color: #f8fafc;
      padding: 16px;
    }
    .header {
      display: flex;
      items-center: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 14px;
    }
    .logo {
      font-weight: 900;
      font-size: 16px;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .logo span {
      color: #a855f7;
    }
    .badge-status {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .connected {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .disconnected {
      background: rgba(239, 68, 68, 0.15);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .card-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .card-value {
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      color: white;
      box-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }
    .btn-primary:hover {
      brightness: 1.1;
      transform: translateY(-1px);
    }
    .footer {
      margin-top: 12px;
      text-align: center;
      font-size: 10px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">AFF <span>HUB</span></div>
    <div id="statusBadge" class="badge-status disconnected">
      <span class="dot"></span>
      <span id="statusText">Not Connected</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Trang hiện tại</div>
    <div id="currentPage" class="card-value">Đang kiểm tra...</div>
  </div>

  <div class="card">
    <div class="card-title">Thiết bị & Nhịp tim</div>
    <div id="deviceToken" class="card-value">Device ID: Pairing...</div>
  </div>

  <div class="card">
    <div class="card-title">Server Đích</div>
    <select id="serverSelect" style="width: 100%; padding: 6px; border-radius: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; font-size: 11px; font-weight: bold; cursor: pointer;">
      <option value="http://localhost:3000">💻 Localhost (http://localhost:3000)</option>
      <option value="https://affnhanh.vercel.app">🌐 Vercel Prod (https://affnhanh.vercel.app)</option>
    </select>
  </div>

  <button id="scanBtn" class="btn btn-primary">
    ⚡ QUÉT SHOP NÀY VỀ AFF HUB
  </button>

  <div class="footer">
    AFF HUB Chrome Extension Bridge v1.0.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
